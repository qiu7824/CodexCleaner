[workspace]
members = [
    "crates/app-zsui",
    "crates/cleaner-core",
]
exclude = ["vendor/zsui"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.20"
thiserror = "2"
walkdir = "2.5"
zstd = "0.13"
trash = "=5.2.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
