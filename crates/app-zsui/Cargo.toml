[package]
name = "codex-cleaner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cleaner-core = { path = "../cleaner-core" }
chrono.workspace = true
serde_json.workspace = true
windows-sys.workspace = true
zsui = { version = "=0.2.0-preview.6", path = "../../vendor/zsui", default-features = false, features = [
    "windows-win32",
    "button",
    "label",
    "icon",
    "dialog",
    "info-bar",
    "scroll",
    "virtual-list",
    "table",
    "progress",
    "progress-ring",
    "style",
    "dark-mode",
    "toggle",
    "native-smoke",
] }

[build-dependencies]
winresource = "=0.1.31"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "codex-cleaner"
path = "src/main.rs"

[[bin]]
name = "codex-cleaner-cli"
path = "src/bin/cli.rs"
